<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Moji Računi</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>Moji Računi</h1><p>Pregled mesečnih obaveza</p></div><button class="iconbtn" onclick="openMenu()">⋮</button></header>
<main><section class="month card"><button onclick="move(-1)">‹</button><div><b id="month"></b><small id="status"></small></div><button onclick="move(1)">›</button></section>
<section class="progress card"><div><span>Napredak</span><b id="percent"></b></div><div class="bar"><i id="bar"></i></div></section>
<section class="totals"><div class="card"><small>Ukupno</small><b id="total"></b></div><div class="card good"><small>Plaćeno</small><b id="paid"></b></div><div class="card warn"><small>Preostalo</small><b id="left"></b></div></section>
<nav><button id="kg" onclick="loc='Kragujevac';render()">Kragujevac</button><button id="bg" onclick="loc='Beograd';render()">Beograd</button></nav>
<section id="list"></section><button class="primary add" onclick="addBill()">＋ Dodaj račun</button><p class="foot">Podaci se čuvaju samo na ovom uređaju.</p></main>
<dialog id="dlg"><h2 id="dt">Račun</h2><input id="id" type="hidden"><label>Naziv<input id="name"></label><label>Lokacija<select id="location"><option>Kragujevac</option><option>Beograd</option></select></label><label>Iznos (RSD)<input id="amount" type="number" min="0" step=".01"></label><label>Rok plaćanja<input id="due" type="number" min="1" max="31" placeholder="Dan u mesecu"></label><label>Napomena<input id="note"></label><div class="actions"><button class="danger" onclick="del()">Obriši</button><span></span><button onclick="dlg.close()">Otkaži</button><button class="primary" onclick="saveBill()">Sačuvaj</button></div></dialog>
<dialog id="menu"><h2>Opcije</h2><button class="wide" onclick="menu.close();showHistory()">Istorija meseci</button><button class="wide" onclick="exportData()">Sačuvaj backup</button><label class="wide file">Učitaj backup<input type="file" accept=".json,application/json" onchange="importData(this)"></label><button class="wide" onclick="menu.close()">Zatvori</button></dialog>
<dialog id="hist"><h2>Istorija</h2><div id="histlist"></div><button class="wide" onclick="hist.close()">Zatvori</button></dialog>
<script src="app.js"></script></body></html>
