<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202124"><title>Moji Računi</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><header><h1>Moji Računi</h1><button onclick="showHistory()">Istorija</button></header><main><section class="month"><button onclick="move(-1)">‹</button><div><b id="month"></b><small id="status"></small></div><button onclick="move(1)">›</button></section><section class="totals"><div>Ukupno<b id="total"></b></div><div>Plaćeno<b id="paid"></b></div><div>Preostalo<b id="left"></b></div></section><nav><button id="kg" onclick="loc='Kragujevac';render()">Kragujevac</button><button id="bg" onclick="loc='Beograd';render()">Beograd</button></nav><section id="list"></section><button class="primary" onclick="addBill()">+ Dodaj račun</button><p class="note">Podaci se čuvaju lokalno u ovom browseru.</p></main><dialog id="dlg"><h2 id="dt">Račun</h2><input id="id" type="hidden"><label>Naziv<input id="name"></label><label>Lokacija<select id="location"><option>Kragujevac</option><option>Beograd</option></select></label><label>Iznos (RSD)<input id="amount" type="number" min="0" step=".01"></label><label>Rok plaćanja (dan)<input id="due" type="number" min="1" max="31"></label><label>Napomena<input id="note"></label><div class="actions"><button onclick="del()">Obriši</button><button onclick="dlg.close()">Otkaži</button><button class="primary" onclick="saveBill()">Sačuvaj</button></div></dialog><dialog id="hist"><h2>Istorija</h2><div id="histlist"></div><button onclick="hist.close()">Zatvori</button></dialog><script src="app.js"></script></body></html>
